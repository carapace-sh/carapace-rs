[package]
name = "carapace-macros"
description = "Macros for wiring carapace completers into clap derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["clap", "derive", "macros", "completion", "carapace"]
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
carapace-clap = { path = "../carapace-clap", version = "0.1.0" }
carapace-core = { path = "../carapace-core", version = "0.1.0" }
carapace-testkit = { path = "../carapace-testkit", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
