[package]
name = "carapace-rs-clap"
description = "carapace completion for clap-based Rust CLIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
readme.workspace = true
keywords = ["clap", "completion", "shell", "carapace"]
categories.workspace = true

[dependencies]
carapace-rs = { path = "../carapace-rs", version = "0.1.0" }
carapace-rs-spec = { path = "../carapace-rs-spec", version = "0.1.0", optional = true }
serde_json = "1"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "unstable-ext"] }

[features]
default = ["spec"]
spec = ["dep:carapace-rs-spec"]

[dev-dependencies]
carapace-rs-testkit = { path = "../carapace-rs-testkit", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
