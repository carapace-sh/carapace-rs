[package]
name = "carapace-macros"
description = "Macros for wiring carapace completers into clap derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
carapace-clap = { path = "../carapace-clap" }
carapace-core = { path = "../carapace-core" }
carapace-testkit = { path = "../carapace-testkit" }
clap = { version = "4.6", features = ["derive"] }
