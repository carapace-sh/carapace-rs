[workspace]
resolver = "3"
members = ["carapace-rs-shlex", "carapace-rs", "carapace-rs-clap", "carapace-rs-testkit", "carapace-rs-spec", "carapace-rs-bridge"]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.85"

repository = "https://github.com/carapace-sh/carapace-rs"
readme = "README.md"
keywords = ["completion", "shell", "carapace"]
categories = ["command-line-utilities", "development-tools"]
