name: Rust

on:
  pull_request:
  push:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: shallow clone
      uses: actions/checkout@v4

    - name: Install shells
      run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends fish zsh

    - name: Build
      run: cargo build --verbose

    - name: Run tests
      run: cargo test --verbose

    - name: Publish crates
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        sed -i "s_0.0.0-PLACEHOLDER_${GITHUB_REF/refs\/tags\/v/}_" Cargo.toml
        cargo publish --workspace --allow-dirty --token ${CRATES_TOKEN}
      env:
        CRATES_TOKEN: ${{ secrets.CRATES_TOKEN }}
