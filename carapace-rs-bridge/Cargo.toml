[package]
name = "carapace-rs-bridge"
description = "Bridge external completion frameworks into carapace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
carapace-rs = { path = "../carapace-rs", version = "0.0.3" }
serde_json = "1"
dirs = "6"
carapace-rs-shlex = { path = "../carapace-rs-shlex", version = "0.0.3" }

[dev-dependencies]
carapace-rs-clap = { path = "../carapace-rs-clap" }
carapace-rs-testkit = { path = "../carapace-rs-testkit" }
clap = { version = "4.6" }
