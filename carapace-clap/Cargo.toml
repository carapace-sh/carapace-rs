[package]
name = "carapace-clap"
description = "carapace completion for clap-based Rust CLIs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["clap", "completion", "shell", "carapace"]
categories.workspace = true

[dependencies]
carapace-core = { path = "../carapace-core", version = "0.1.0" }
carapace-spec = { path = "../carapace-spec", version = "0.1.0" }
serde_json = "1"
clap = { version = "4.6", default-features = false, features = ["std", "help", "usage", "error-context", "unstable-ext"] }

[dev-dependencies]
carapace-testkit = { path = "../carapace-testkit", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
